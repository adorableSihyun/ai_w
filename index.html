<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>강의 소개</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top" data-scroll="top">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <path d="M16 29C9 24 6 17 9 9c4 3 7 8 7 20Z" fill="currentColor" opacity=".55" />
          <path d="M16 29c7-5 10-12 7-20-4 3-7 8-7 20Z" fill="currentColor" />
        </svg>
        <span class="brand-text"></span>
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav"><ul></ul></nav>
      <button class="admin-lock" type="button" aria-label="관리자 화면 열기" title="관리자">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
          <path class="lock-shackle" d="M8 11V7.5a4 4 0 0 1 8 0V11"></path>
          <circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- 첫 화면: 큰 장면 + 거대한 세리프 단어 -->
    <section class="hero">
      <div class="hero-stage">
        <div class="hero-visual" aria-hidden="true">
          <div class="art art-hero"><i></i><i></i><i></i></div>
        </div>
        <p class="hero-word" aria-hidden="true"></p>
      </div>
      <div class="hero-inner">
        <div class="hero-card">
          <div class="hero-left">
            <span class="hero-badge"></span>
            <p class="hero-dept"></p>
            <h1 class="hero-title"></h1>
            <p class="hero-subtitle"></p>
          </div>
          <div class="hero-right">
            <p class="hero-desc"></p>
            <div class="hero-buttons"></div>
          </div>
        </div>
        <div class="quick-info"></div>
      </div>
    </section>

    <section class="section section-tight" id="notices" aria-label="공지사항" hidden></section>
    <section class="section section-tight" id="stats" aria-label="주요 수치"></section>
    <section class="section" id="about" data-word="learn"></section>
    <section class="section" id="curriculum" data-word="weeks"></section>
    <section class="section" id="calendar" data-word="days"></section>
    <section class="section" id="participate" data-word="join"></section>
    <section class="section" id="tools" data-word="tools"></section>
    <section class="section" id="enroll" data-word="begin"></section>
    <section class="section section-flush" id="apply"></section>
    <section class="section" id="faq" data-word="ask"></section>
  </main>

  <!-- 교수자 소개 푸터 -->
  <footer class="site-footer" id="instructor"></footer>

  <button class="to-top" aria-label="맨 위로 이동">↑</button>

  <script src="config.js"></script>
  <!-- 서버(Railway)에서 실행될 때만 존재: DB에 저장된 설정과 API 사용 여부. 파일로 열면 없어도 괜찮아요 -->
  <script src="site-data.js"></script>
  <script src="main.js"></script>
  <script src="features.js"></script>
  <script src="admin.js"></script>
</body>
</html>
